questions:
  - id: 1
    question:
      en: Who are all the Presidents of France?
      es: ¿Quiénes son todos los Presidentes de Francia?
    features:
      - SELECT
      - DISTINCT
      - UNION
    classes:
      - onto:President
      - onto:Person
    properties:
      - rdf:type
      - onto:country
      - prop:title
    query:
      sparql: |
        PREFIX rdf: <http://www.w3.org/1999/02/22-rdf-syntax-ns#>
        PREFIX onto: <http://dbpedia.org/ontology/>
        PREFIX res: <http://dbpedia.org/resource/>
        PREFIX prop: <http://dbpedia.org/property/>

        SELECT DISTINCT ?uri
        WHERE 
        {
          {
            ?uri rdf:type onto:President .
            ?uri onto:country res:France .
          }
          UNION
          {
            ?uri rdf:type onto:Person .
            ?uri prop:title res:President_of_France .
          }
        }

  - id: 2
    question:
      en: Which actor appeared in the most films in a single decade?
      es: ¿Qué actor apareció en la mayor cantidad de películas en una sola década?
    features:
      - SELECT
      - GroupBy
      - OrderBy
      - DESC
      - Limit
      - COUNT
      - SubQuery
      - UNION
    classes:
      - dbo:Film
    properties:
      - dbo:starring
      - dbo:releaseDate
      - dbo:runtime
      - rdfs:label
    query:
      sparql: |
        PREFIX dbo: <http://dbpedia.org/ontology/>
        PREFIX dbr: <http://dbpedia.org/resource/>
        PREFIX xsd: <http://www.w3.org/2001/XMLSchema#>

        SELECT ?actor
        WHERE {
          {
            SELECT ?actor ((FLOOR(?year/10)*10) AS ?decade) ?film
            WHERE {
              ?film a dbo:Film ;
                    dbo:starring ?actor ;
                    dbo:releaseDate ?date .
              BIND (xsd:integer(SUBSTR(STR(?date),1,4)) AS ?year)
            }
          }
        }
        GROUP BY ?actor ?decade
        ORDER BY DESC(COUNT(DISTINCT ?film))
        LIMIT 1

  - id: 3
    question:
      en: Who (either an actor or a musician) has received the highest number of awards?
      es: ¿Quién (ya sea un actor o un músico) ha recibido el mayor número de premios?
    features:
      - SELECT
      - GroupBy
      - OrderBy
      - DESC
      - Limit
      - COUNT
      - UNION
    classes:
      - dbo:Actor
      - dbo:MusicalArtist
    properties:
      - dbo:award
      - rdf:type
    query:
      sparql: |
        PREFIX dbo: <http://dbpedia.org/ontology/>
        PREFIX foaf: <http://xmlns.com/foaf/0.1/>

        SELECT ?person
        WHERE {
          {
            ?person a dbo:Actor .
          }
          UNION
          {
            ?person a dbo:MusicalArtist .
          }

          ?person dbo:award ?award .
        }
        GROUP BY ?person
        ORDER BY DESC(COUNT(DISTINCT ?award))
        LIMIT 1

  - id: 4
