      en: Which are the 5 bands or musicians who have produced the highest number of albums?
      es: ¿Cuáles son las 5 bandas o músicos que han producido el mayor número de álbumes?
    features:
      - SELECT
      - GroupBy
      - OrderBy
      - DESC
      - Limit
      - COUNT
      - UNION
    classes:
      - dbo:MusicalArtist
      - dbo:Band
    properties:
      - dbo:artist
    query:
      sparql: |
        PREFIX dbo: <http://dbpedia.org/ontology/>

        SELECT ?artist
        WHERE {
          {
            ?artist a dbo:MusicalArtist .
          }
          UNION
          {
            ?artist a dbo:Band .
          }

          ?album dbo:artist ?artist .
        }
        GROUP BY ?artist
        ORDER BY DESC(COUNT(DISTINCT ?album))
        LIMIT 5

  - id: 5
    question:
      en: Which are the top 3 taxonomic kingdoms that have the largest number of endangered species?
      es: ¿Cuáles son los 3 reinos taxonómicos con el mayor número de especies en peligro de extinción?
    features:
      - SELECT
      - Filter
      - GroupBy
      - OrderBy
      - Limit
      - DESC
      - COUNT
      - SubQuery
    classes:
      - dbo:Species
    properties:
      - dbo:conservationStatus
      - dbo:kingdom
    query:
      sparql: |
        PREFIX dbo: <http://dbpedia.org/ontology/>
        PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>

        SELECT ?kingdom
        WHERE {
          {
            SELECT ?species ?kingdom
            WHERE {
              ?species a dbo:Species ;
                      dbo:conservationStatus ?status ;
                      dbo:kingdom ?kingdom .
              FILTER (regex(str(?status), "Endangered|Critically endangered", "i"))
            }
          }
        }
        GROUP BY ?kingdom
        ORDER BY DESC(COUNT(DISTINCT ?species))
        LIMIT 3

