[tool.poetry]
name = "text2sparql.aksw.org "
version = "1.0.0"
description = "Webpage of the First International TEXT2SPARQL Challenge"
authors = ["Sebastian Tramp <sebastian.tramp@eccenca.com>"]
homepage = "https://github.com/aksw/text2sparql.aksw.org"
readme = "README.md"
classifiers = [
    "Private :: Do Not Upload",
]
packages = [{include = "tools"}]


[tool.poetry.dependencies]
python = "^3.13"
Pillow = "^12.1.0"
CairoSVG = "^2.8.2"
mike = "^2.1.3"
mkdocs = "^1.6.1"
mkdocs-git-revision-date-localized-plugin = "^1.5.1"
mkdocs-awesome-pages-plugin = "^2.10.1"
mkdocs-glightbox = "^0.5.2"
mkdocs-macros-plugin = "^1.5.0"
mkdocs-autolinks-plugin = "^0.7.1"
mkdocs-redirects = "^1.2.2"
mkdocs-swagger-ui-tag = "^0.7.2"
mkdocs-material = "9.7.1"
pymdown-extensions = "^10.20.1"

[tool.poetry.group.dev.dependencies]
linkcheckmd = "^1.4.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

