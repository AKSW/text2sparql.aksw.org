- id: 24
  question:
    en: Which potentiometer has the smallest volume?
    de: Welches Potentiometer hat das kleinste Volumen?
  features:
  - SELECT
  - ORDER
  - LIMIT
  - BIND
  classes:
  - :ProductCategory
  - :Product
  properties:
  - :hasCategory
  - :width_mm
  - :depth_mm
  - :height_mm
  query:
    sparql: "PREFIX pv: <http://ld.company.org/prod-vocab/>\nSELECT DISTINCT ?result\n\
      WHERE\n{\n  ?result pv:hasCategory <http://ld.company.org/prod-instances/prod-cat-Potentiometer>\
      \ .\n  ?result pv:width_mm ?width_mm .\n  ?result pv:depth_mm ?depth_mm .\n\
      \  ?result pv:height_mm ?height_mm .\n  BIND(?width_mm * ?depth_mm * ?height_mm\
      \ as ?volume)\n}\nORDER BY ASC(?volume)\nLIMIT 1\n"
- id: 25
  question:
    en: Which coil has the greatest density?
    de: Welche Spule hat die größte Dichte?
  features:
  - SELECT
  - ORDER
  - LIMIT
  - BIND
  classes:
  - :ProductCategory
  - :Product
  properties:
  - :hasCategory
  - :width_mm
